services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aghatsethu
      POSTGRES_USER: aghatsethu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aghatsethu -d aghatsethu"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://aghatsethu:${POSTGRES_PASSWORD}@db:5432/aghatsethu
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      CARLA_SHARED_SECRET: ${CARLA_SHARED_SECRET:?Set CARLA_SHARED_SECRET in .env}
      VISION_SHARED_SECRET: ${VISION_SHARED_SECRET:?Set VISION_SHARED_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      MEDIA_DIR: /app/media
      MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-524288000}
    ports:
      - "8000:8000"
    volumes:
      - api-media:/app/media

volumes:
  postgres-data:
  api-media:
